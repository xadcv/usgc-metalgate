# USGC Metalgate — inspired by USGC-METALGATE (United States Graphics Co., PN# 5200-050)
# Cyan scheme: metal gate transistor. Black background, fluorescent cyan foreground,
# fluorescent blue cursor, olive selection with fluorescent yellow text.

# Accent and UI colors
accent = "#00ffff"

# Cursor colors
cursor = "#0000ff"

# Primary colors
foreground = "#00ffff"
background = "#000000"

# Selection colors
selection_foreground = "#ffff00"
selection_background = "#666600"

# Normal colors (ANSI 0-7)
color0 = "#000000"
color1 = "#660000"
color2 = "#00a645"
color3 = "#ffbf00"
color4 = "#3366cc"
color5 = "#660066"
color6 = "#006666"
color7 = "#999999"

# Bright colors (ANSI 8-15) — fluorescent CMYK
color8  = "#4a4a4a"
color9  = "#ff0000"
color10 = "#00ff00"
color11 = "#ffff00"
color12 = "#4d8fff"
color13 = "#ff00ff"
color14 = "#00ffff"
color15 = "#ffffff"
